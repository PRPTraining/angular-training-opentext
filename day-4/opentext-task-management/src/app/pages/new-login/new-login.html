<form (submit)="onSubmit()">
  <!-- Username -->
  <div>
    <label>Username</label>

    <input type="text" [formField]="loginForm.username" placeholder="Enter username" />

    @if (loginForm.username().touched() && loginForm.username().invalid()) {
      <p class="error">
        {{ loginForm.username().errors()[0].message }}
      </p>
    }
  </div>

  <!-- Password -->
  <div>
    <label>Password</label>

    <input type="password" [formField]="loginForm.password" placeholder="Enter password" />

    @if (loginForm.password().touched() && loginForm.password().invalid()) {
      <p class="error">
        {{ loginForm.password().errors()[0].message }}
      </p>
    }
  </div>

  <!-- Submit -->
  <button type="submit" [disabled]="loginForm().invalid()">Login</button>
</form>
